plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.15'
}

version = '0.1.0'

nextflowPlugin {
    nextflowVersion = '26.10.0'  // TaskCacheStrategy/TaskHasherFactory need 26.x

    provider = 'vagkaratzas'
    description = 'Robotic wet-lab steps in Nextflow pipelines: a lab executor that never runs a wet step twice and safe-stops robots on abort'
    className = 'vagkaratzas.plugin.LabPlugin'
    extensionPoints = [
        'vagkaratzas.plugin.LabConfig',
        'vagkaratzas.plugin.LabExecutor',
        'vagkaratzas.plugin.LabExtension',
        'vagkaratzas.plugin.LabFactory'
    ]
}

// Keep parameter names in spec.json (arg0 otherwise); drop once nextflow-plugin-gradle#27 ships
tasks.withType(GroovyCompile).configureEach { groovyOptions.parameters = true }
