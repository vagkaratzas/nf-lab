# Weekly version updates, opened against dev (dev reaches main by PR).
# Security updates are separate: GitHub opens those against main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      gradle:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directories: [/adapter, /dashboard]
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
    ignore:
      # 1.0 deprecates the front-end/backend API the bindings use; moving is its own piece of work.
      - dependency-name: pylabrobot
        versions: ['>=1']
