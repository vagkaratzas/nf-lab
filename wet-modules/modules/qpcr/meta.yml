# A wet module: nf-core meta.yml, plus `lab`: what a lab matches against its robots
# (GET /devices: each robot's capability and protocols). One module per protocol.
name: qpcr
description: "Run an RNA plate through a fixed one-step RT-qPCR program on a real-time PCR instrument: a Ct per well"
keywords: [wet-lab, qpcr, rt-qpcr, ct]
lab:
  capability: qpcr  # the hint the module declares (hints 'lab/capability')
  protocol: qpcr
  protocol_version: "1.0"
  stop_boundary: "cycling starts (lid closed, plate untouched before)"
  params: input.schema.json  # set with ext.params; the lab's adapter holds defaults and limits
input:
  - plate:
      type: record
      description: The plate (id) and its plate-map wells (row, column, sample, type: sample, negative_control (no-template control), positive_control, blank (extraction blank))
output:
  - id:
      type: string
      description: The plate ID
  - result:
      type: file
      pattern: result.json
      description: "What the protocol did, per plate-map well: program (temperatures, holds, cycles, channel); wells[] with ct (null: undetermined)"
  - provenance:
      type: file
      pattern: provenance.json
      description: The device job (device, attempt, state, times), any final state
  - log:
      type: file
      pattern: labctl.log
      description: Every request to the device adapter and its reply
authors: ["@vagkaratzas"]
