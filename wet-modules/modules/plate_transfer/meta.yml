# A wet module: nf-core meta.yml, plus `labrobotics`: what a lab matches against its robots
# (GET /devices: each robot's capability and protocols). One module per protocol.
name: plate_transfer
description: "Transfer each plate-map well from the source plate to a destination plate"
keywords: [wet-lab, liquid-handling, plate_transfer]
lab:
  capability: liquid-handling  # the hint the module declares (hints 'labrobotics/capability')
  protocol: plate_transfer
  protocol_version: "1.0"
  stop_boundary: "first aspirate (moves liquid)"
  params: input.schema.json  # set with ext.params; the lab's adapter holds defaults and limits
input:
  - plate:
      type: record
      description: The plate (id) and its plate-map wells (row, column, sample, type)
output:
  - id:
      type: string
      description: The plate ID
  - result:
      type: file
      pattern: result.json
      description: "What the protocol did, per plate-map well: wells[].volume_ul"
  - provenance:
      type: file
      pattern: provenance.json
      description: The device job (device, attempt, state, times), any final state
  - log:
      type: file
      pattern: labctl.log
      description: Every request to the device adapter and its reply
authors: ["@vagkaratzas"]
