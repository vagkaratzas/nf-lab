# A wet module: nf-core meta.yml, plus `lab`: what a lab matches against its robots
# (GET /devices: each robot's capability and protocols). One module per protocol.
name: powder_dispense
description: "Dose a powder into each plate-map well"
keywords: [wet-lab, powder-dispensing, powder_dispense]
lab:
  capability: powder-dispensing  # the hint the module declares (hints 'lab/capability')
  protocol: powder_dispense
  protocol_version: "1.0"
  stop_boundary: "the first dose (plate untouched before)"
input:
  - plate:
      type: record
      description: The plate (id) and its plate-map wells (row, column, sample, type)
output:
  - id:
      type: string
      description: The plate ID
  - result:
      type: file
      pattern: result.json
      description: "What the protocol did, per plate-map well: powder; wells[].amount_mg"
  - provenance:
      type: file
      pattern: provenance.json
      description: The device job (device, attempt, state, times), any final state
  - log:
      type: file
      pattern: labctl.log
      description: Every request to the device adapter and its reply
authors: ["@vagkaratzas"]
